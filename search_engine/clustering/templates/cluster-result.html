<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clustering Result</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'style.css' %}" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .navbar {
            background-color: #343a40;
        }
        .navbar-brand img {
            max-height: 50px;
        }
        .navbar-title {
            color: #000000;
            font-size: 28px;
            font-weight: 700;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
        }
        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
        }
        .card {
            background: #ffffff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border: none;
            border-radius: 10px;
            width: 100%;
            max-width: 600px;
            padding: 40px;
        }
        .btn-primary {
            background-color: #007bff;
            border: none;
            border-radius: 25px;
            padding: 10px 20px;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .form-control {
            border-radius: 25px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <a class="navbar-brand" href="{% url 'home' %}">
            <img src="{% static 'logo.png' %}" alt="Logo">
        </a>
        <div class="navbar-title">Clustering Result</div>
    </nav>

    <!-- Main Container -->
    <div class="container main-container">
        <div class="row justify-content-center w-100">
            <div class="col-12">
                <div class="card text-center">
                    <h2 class="mb-4">Document Cluster Category</h2>
                    <p class="lead">The document belongs to the cluster: <strong>{{ cluster_category }}</strong></p>
                    <a href="{% url 'cluster-home' %}" class="btn btn-primary mt-4">Go Back</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
